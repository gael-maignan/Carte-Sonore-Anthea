<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte sonore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root { --ink: #1d2433; --muted: #6b7385; --line: #e2e5eb; --bg: #f6f7f9; --accent: #e4572e; --accent-dark: #b83f1d; --panel-w: 340px; --h: 36px; }
  * { box-sizing: border-box; border-radius: 0; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  button { font: inherit; color: inherit; }
  .ico { width: 18px; height: 18px; display: block; fill: currentColor; flex: none; }

  /* Barre du haut */
  .topbar { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); z-index: 1000; }
  .topbar h1 { font-size: 17px; font-weight: 650; margin: 0; flex: 1; line-height: 1; }
  .btn { height: var(--h); display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border: 1px solid var(--line); background: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
  .btn:hover { border-color: #c4cad6; }

  /* Liste */
  #app { position: fixed; inset: 56px 0 0 0; display: flex; }
  #panel { width: var(--panel-w); flex: none; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: margin .25s; }
  #panel.hidden { margin-left: calc(-1 * var(--panel-w)); }
  #panel .search { padding: 12px; border-bottom: 1px solid var(--line); }
  #filter { width: 100%; height: var(--h); padding: 0 10px; border: 1px solid var(--line); font: inherit; font-size: 14px; background: #fff; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 12px; align-items: center; }
  #list li:hover { background: var(--bg); }
  #list li.active { background: #fdf0eb; }
  #list .info { min-width: 0; flex: 1; }
  #list .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .m { color: var(--muted); font-size: 12px; margin-top: 3px; }
  #list .empty { color: var(--muted); cursor: default; }
  .play { flex: none; width: var(--h); height: var(--h); display: grid; place-items: center; padding: 0; border: none; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer; }
  .play:hover { background: var(--accent-dark); }
  .play .ico { width: 18px; height: 18px; }

  #map { flex: 1; background: #eef0f2; }
  .tiles-light { filter: grayscale(1) brightness(1.06) contrast(.88); }

  /* Marqueurs */
  .pin { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .pin.playing { background: var(--accent-dark); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(228,87,46,.6); } 100% { box-shadow: 0 0 0 12px rgba(228,87,46,0); } }

  /* Popup */
  .leaflet-container { font-family: inherit; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-bar, .leaflet-bar a, .leaflet-tooltip, .leaflet-control-attribution { border-radius: 0 !important; }
  .leaflet-popup-content-wrapper { box-shadow: 0 4px 18px rgba(0,0,0,.18); }
  .leaflet-popup-content { margin: 14px 16px; }
  .pop h3 { margin: 0 0 4px; font-size: 15px; padding-right: 12px; }
  .pop .m { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pop p { margin: 0 0 12px; white-space: pre-wrap; max-height: 160px; overflow: auto; font-size: 13px; line-height: 1.45; }
  .pop .listen { display: inline-flex; align-items: center; gap: 10px; padding: 0; border: none; background: none; color: var(--ink); font-weight: 600; font-size: 14px; line-height: 1; cursor: pointer; }
  .pop .listen .round { width: var(--h); height: var(--h); display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; }
  .pop .listen:hover .round { background: var(--accent-dark); }

  /* Lecteur */
  #player { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: #fff; border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 10px 12px; z-index: 1001; display: none; }
  #player.show { display: block; }
  .pl-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #now { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .close { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: none; background: none; color: var(--muted); cursor: pointer; }
  .close:hover { color: var(--ink); }
  .pl { display: flex; align-items: center; gap: 12px; }
  .pl-btn { flex: none; width: var(--h); height: var(--h); display: grid; place-items: center; padding: 0; border: none; border-radius: 50%; background: var(--ink); color: #fff; cursor: pointer; }
  .pl-time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 82px; text-align: right; }
  .pl-seek { --p: 0%; flex: 1; min-width: 0; height: 20px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .pl-seek::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
  .pl-seek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; background: var(--ink); border: 0; border-radius: 50%; }
  .pl-seek::-moz-range-track { height: 3px; background: var(--line); }
  .pl-seek::-moz-range-progress { height: 3px; background: var(--accent); }
  .pl-seek::-moz-range-thumb { width: 12px; height: 12px; background: var(--ink); border: 0; border-radius: 50%; }

  #status { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; font-size: 14px; z-index: 1002; display: none; }
  #status.show { display: block; } #status.error { background: #b42318; }

  @media (max-width: 720px) {
    #panel { position: absolute; inset: 0 auto 0 0; z-index: 900; --panel-w: 85vw; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1 id="map-title">Carte sonore</h1>
  <button class="btn" id="toggle" type="button"><span id="toggle-ico"></span><span>Sons (<span id="count">0</span>)</span></button>
</header>

<div id="app">
  <aside id="panel">
    <div class="search"><input id="filter" type="search" placeholder="Rechercher"></div>
    <ul id="list"></ul>
  </aside>
  <main id="map"></main>
</div>

<div id="player">
  <div class="pl-head"><span id="now"></span><button class="close" id="close" type="button" aria-label="Fermer"></button></div>
  <div class="pl" id="pl"></div>
</div>
<div id="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script>
(() => {
  const CFG = window.CARTE_SONORE_CONFIG || {};
  const API = (() => {
    let u = String(CFG.API_URL || '').trim();
    if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
    try { return new URL(u).origin; } catch { return ''; }
  })();
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = sec => { if (!Number.isFinite(sec)) return '0:00'; const s = Math.floor(sec), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}` : `${m}:${String(r).padStart(2, '0')}`; };

  const I = {
    play: 'M8 5v14l11-7z',
    pause: 'M6 5h4v14H6zM14 5h4v14h-4z',
    note: 'M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z',
    close: 'M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z',
    menu: 'M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z'
  };
  const svg = d => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;

  const title = CFG.MAP_TITLE || 'Carte sonore';
  $('#map-title').textContent = title; document.title = title;
  $('#toggle-ico').outerHTML = svg(I.menu);
  $('#close').innerHTML = svg(I.close);

  const isMobile = matchMedia('(max-width: 720px)').matches;
  if (isMobile) $('#panel').classList.add('hidden');

  /* Carte : OpenStreetMap, sans clé, rendu clair en niveaux de gris */
  const map = L.map('map').setView(CFG.MAP_CENTER || [46.6, 2.4], CFG.MAP_ZOOM || 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, className: 'tiles-light',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');

  /* Lecteur */
  function createPlayer(root, onChange) {
    root.innerHTML = '<button type="button" class="pl-btn" aria-label="Lecture"></button><input type="range" class="pl-seek" min="0" max="1000" value="0" aria-label="Position"><span class="pl-time">0:00</span>';
    const audio = new Audio(); audio.preload = 'none';
    const btn = root.querySelector('.pl-btn'), seek = root.querySelector('.pl-seek'), time = root.querySelector('.pl-time');
    let fallback = null, dragging = false;
    const dur = () => (Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : fallback);
    const render = () => {
      btn.innerHTML = svg(audio.paused ? I.play : I.pause);
      btn.setAttribute('aria-label', audio.paused ? 'Lecture' : 'Pause');
      const d = dur();
      if (!dragging) seek.value = d ? Math.round(audio.currentTime / d * 1000) : 0;
      seek.style.setProperty('--p', seek.value / 10 + '%');
      time.textContent = fmt(audio.currentTime) + (d ? ' / ' + fmt(d) : '');
    };
    ['play', 'pause', 'timeupdate', 'loadedmetadata', 'durationchange', 'ended', 'emptied'].forEach(ev => audio.addEventListener(ev, () => { render(); onChange && onChange(); }));
    btn.addEventListener('click', () => audio.paused ? audio.play().catch(() => {}) : audio.pause());
    seek.addEventListener('input', () => { dragging = true; seek.style.setProperty('--p', seek.value / 10 + '%'); const d = dur(); if (d) time.textContent = fmt(seek.value / 1000 * d) + ' / ' + fmt(d); });
    seek.addEventListener('change', () => { const d = dur(); if (d) audio.currentTime = seek.value / 1000 * d; dragging = false; });
    render();
    return {
      audio,
      load(src, duration) { audio.src = src; fallback = duration || null; render(); },
      clear() { audio.pause(); audio.removeAttribute('src'); audio.load(); fallback = null; render(); }
    };
  }

  const player = createPlayer($('#pl'), () => refreshActive());
  const audio = player.audio;
  let items = [], markers = new Map(), currentId = null;

  function streamUrl(id) {
    const u = new URL(CFG.STREAM_URL || 'https://stream.gael-maignan.workers.dev/');
    u.searchParams.set('id', id);
    if (CFG.GOOGLE_API_KEY && !/COLLEZ/.test(CFG.GOOGLE_API_KEY)) u.searchParams.set('key', CFG.GOOGLE_API_KEY);
    return u.toString();
  }

  function status(msg, error = false, ms = 0) {
    const el = $('#status');
    el.textContent = msg; el.className = msg ? 'show' + (error ? ' error' : '') : '';
    if (ms) setTimeout(() => { el.className = ''; }, ms);
  }

  const isPlaying = id => id === currentId && !audio.paused;
  const icon = playing => L.divIcon({ className: '', html: `<div class="pin${playing ? ' playing' : ''}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10] });

  const listenInner = id => `<span class="round">${svg(isPlaying(id) ? I.pause : I.play)}</span><span>${isPlaying(id) ? 'Pause' : 'Écouter'}</span>`;

  function popupContent(it) {
    const div = document.createElement('div');
    div.className = 'pop';
    div.innerHTML = `<h3>${esc(it.title)}</h3>${it.duration ? `<div class="m">${esc(it.duration)}</div>` : ''}${it.description ? `<p>${esc(it.description)}</p>` : ''}<button type="button" class="listen">${listenInner(it.id)}</button>`;
    div.querySelector('.listen').addEventListener('click', () => toggle(it));
    return div;
  }

  function toggle(it) {
    if (currentId === it.id) { audio.paused ? audio.play().catch(() => {}) : audio.pause(); return; }
    currentId = it.id;
    player.load(streamUrl(it.id), it.durationSeconds);
    $('#now').textContent = it.title;
    $('#player').classList.add('show');
    audio.play().catch(err => status('Lecture impossible : ' + err.message, true, 5000));
    history.replaceState(null, '', '?son=' + encodeURIComponent(it.id));
    refreshActive();
  }

  function refreshActive() {
    markers.forEach((m, id) => {
      m.setIcon(icon(isPlaying(id)));
      if (m.isPopupOpen()) {
        const b = m.getPopup().getElement()?.querySelector('.listen');
        if (b) b.innerHTML = listenInner(id);
      }
    });
    document.querySelectorAll('#list li[data-id]').forEach(li => {
      li.classList.toggle('active', li.dataset.id === currentId);
      li.querySelector('.play').innerHTML = svg(isPlaying(li.dataset.id) ? I.pause : I.play);
    });
  }
  audio.addEventListener('error', () => { if (audio.getAttribute('src')) { audio.pause(); refreshActive(); status('Impossible de lire ce fichier audio.', true, 5000); } });
  $('#close').addEventListener('click', () => { player.clear(); currentId = null; $('#player').classList.remove('show'); refreshActive(); history.replaceState(null, '', location.pathname); });

  function focus(it, autoplay = false) {
    const m = markers.get(it.id); if (!m) return;
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: .6 });
    setTimeout(() => m.openPopup(), 650);
    if (autoplay) toggle(it);
    if (isMobile) $('#panel').classList.add('hidden');
  }

  function renderList() {
    const q = $('#filter').value.trim().toLowerCase();
    const list = items.filter(it => !q || (it.title + ' ' + it.description).toLowerCase().includes(q));
    $('#list').innerHTML = list.length ? '' : '<li class="empty">Aucun son</li>';
    list.forEach(it => {
      const li = document.createElement('li');
      li.dataset.id = it.id;
      li.innerHTML = `<button class="play" type="button" aria-label="Écouter"></button><div class="info"><div class="t">${esc(it.title)}</div>${it.duration ? `<div class="m">${esc(it.duration)}</div>` : ''}</div>`;
      li.addEventListener('click', () => focus(it));
      li.querySelector('.play').addEventListener('click', e => {
        e.stopPropagation();
        if (currentId === it.id) toggle(it); else focus(it, true);
      });
      $('#list').appendChild(li);
    });
    refreshActive();
  }

  async function load() {
    if (!API || /VOTRE-SOUS-DOMAINE/.test(API)) { status('API_URL manquante dans config.js', true); return; }
    status('Chargement…');
    try {
      const res = await fetch(API + '/list');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      items = (data.items || []).filter(it => Number.isFinite(it.lat) && Number.isFinite(it.lng));
      $('#count').textContent = items.length;
      items.forEach(it => {
        const m = L.marker([it.lat, it.lng], { icon: icon(false), title: it.title }).bindPopup(() => popupContent(it), { maxWidth: 280 }).addTo(map);
        markers.set(it.id, m);
      });
      if (items.length) map.fitBounds(L.latLngBounds(items.map(it => [it.lat, it.lng])), { padding: [50, 50], maxZoom: 16 });
      renderList();
      status('');
      const wanted = new URLSearchParams(location.search).get('son');
      const it = wanted && items.find(i => i.id === wanted);
      if (it) focus(it);
    } catch (err) {
      status('Impossible de charger les sons : ' + err.message, true);
    }
  }

  $('#toggle').addEventListener('click', () => { $('#panel').classList.toggle('hidden'); setTimeout(() => map.invalidateSize(), 300); });
  $('#filter').addEventListener('input', renderList);
  load();
})();
</script>
</body>
</html>
