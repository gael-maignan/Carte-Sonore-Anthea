<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte sonore</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root {
    --ink: #1d2433; --muted: #6b7385; --line: #e4e7ee; --bg: #f7f8fb;
    --accent: #e4572e; --accent-dark: #b83f1d; --panel-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  .topbar { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); z-index: 1000; }
  .topbar h1 { font-size: 18px; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; }
  .topbar h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(228,87,46,.18); }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .btn:hover { border-color: #c9cfdb; }
  #app { position: fixed; inset: 56px 0 0 0; display: flex; }
  #panel { width: var(--panel-w); background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; transition: margin .25s; }
  #panel.hidden { margin-left: calc(-1 * var(--panel-w)); }
  #panel .search { padding: 12px; border-bottom: 1px solid var(--line); }
  #panel input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
  #list li:hover { background: var(--bg); }
  #list li.active { background: #fff3ee; }
  #list .play { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
  #list .t { font-weight: 600; font-size: 14px; }
  #list .m { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #list .empty { color: var(--muted); cursor: default; }
  #map { flex: 1; }
  .sound-pin { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; color: #fff; font-size: 13px; }
  .sound-pin.playing { background: var(--accent-dark); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(228,87,46,.6); } 100% { box-shadow: 0 0 0 16px rgba(228,87,46,0); } }
  .pop h3 { margin: 0 0 4px; font-size: 16px; }
  .pop .m { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pop p { margin: 0 0 10px; white-space: pre-wrap; max-height: 160px; overflow: auto; }
  .pop button { border: none; background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  #player { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.15); padding: 10px 14px; z-index: 1001; display: none; }
  #player.show { display: block; }
  #player .row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #player .now { flex: 1; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player .x { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
  #player audio { width: 100%; height: 36px; }
  #status { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 1002; display: none; }
  #status.show { display: block; } #status.error { background: #b42318; }
  @media (max-width: 720px) {
    #panel { position: absolute; inset: 0 auto 0 0; z-index: 900; width: 85%; --panel-w: 85vw; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
  }
</style>
</head>
<body>
<header class="topbar">
  <h1><span class="dot"></span><span id="map-title">Carte sonore</span></h1>
  <button class="btn" id="toggle">☰ Sons (<span id="count">0</span>)</button>
</header>

<div id="app">
  <aside id="panel">
    <div class="search"><input id="filter" type="search" placeholder="Rechercher un son…"></div>
    <ul id="list"></ul>
  </aside>
  <main id="map"></main>
</div>

<div id="player">
  <div class="row"><span>🎧</span><span class="now" id="now"></span><button class="x" id="close" title="Fermer">×</button></div>
  <audio id="audio" controls preload="none"></audio>
</div>
<div id="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="config.js"></script>
<script>
(() => {
  const CFG = window.CARTE_SONORE_CONFIG || {};
  const API = (CFG.API_URL || '').replace(/\/+$/, '');
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const title = CFG.MAP_TITLE || 'Carte sonore';
  $('#map-title').textContent = title; document.title = title;

  const isMobile = matchMedia('(max-width: 720px)').matches;
  if (isMobile) $('#panel').classList.add('hidden');

  const map = L.map('map').setView(CFG.MAP_CENTER || [46.6, 2.4], CFG.MAP_ZOOM || 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 20
  }).addTo(map);

  const audio = $('#audio');
  let items = [], markers = new Map(), currentId = null;

  function streamUrl(id) {
    const u = new URL(CFG.STREAM_URL || 'https://stream.gael-maignan.workers.dev/');
    u.searchParams.set('id', id);
    if (CFG.GOOGLE_API_KEY && !/COLLEZ/.test(CFG.GOOGLE_API_KEY)) u.searchParams.set('key', CFG.GOOGLE_API_KEY);
    return u.toString();
  }

  function status(msg, error = false, ms = 0) {
    const el = $('#status');
    el.textContent = msg; el.className = 'show' + (error ? ' error' : '');
    if (ms) setTimeout(() => el.className = '', ms);
    if (!msg) el.className = '';
  }

  const icon = playing => L.divIcon({ className: '', html: `<div class="sound-pin${playing ? ' playing' : ''}">♪</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });

  function popupContent(it) {
    const div = document.createElement('div');
    div.className = 'pop';
    div.innerHTML = `<h3>${esc(it.title)}</h3>${it.duration ? `<div class="m">⏱ ${esc(it.duration)}</div>` : ''}${it.description ? `<p>${esc(it.description)}</p>` : ''}<button type="button">▶ Écouter</button>`;
    div.querySelector('button').addEventListener('click', () => play(it));
    return div;
  }

  function play(it) {
    if (currentId === it.id && !audio.paused) { audio.pause(); return; }
    if (currentId !== it.id) {
      audio.src = streamUrl(it.id);
      currentId = it.id;
      $('#now').textContent = it.title;
    }
    $('#player').classList.add('show');
    audio.play().catch(err => status('Lecture impossible : ' + err.message, true, 5000));
    refreshActive();
    history.replaceState(null, '', '?son=' + encodeURIComponent(it.id));
  }

  function refreshActive() {
    markers.forEach((m, id) => m.setIcon(icon(id === currentId && !audio.paused)));
    document.querySelectorAll('#list li[data-id]').forEach(li => li.classList.toggle('active', li.dataset.id === currentId));
  }
  audio.addEventListener('play', refreshActive);
  audio.addEventListener('pause', refreshActive);
  audio.addEventListener('error', () => { if (audio.src) status('Impossible de lire ce fichier audio.', true, 5000); });
  $('#close').addEventListener('click', () => { audio.pause(); audio.removeAttribute('src'); audio.load(); currentId = null; $('#player').classList.remove('show'); refreshActive(); history.replaceState(null, '', location.pathname); });

  function focus(it, autoplay = false) {
    const m = markers.get(it.id); if (!m) return;
    map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: .6 });
    setTimeout(() => m.openPopup(), 650);
    if (autoplay) play(it);
    if (isMobile) $('#panel').classList.add('hidden');
  }

  function renderList() {
    const q = $('#filter').value.trim().toLowerCase();
    const list = items.filter(it => !q || (it.title + ' ' + it.description).toLowerCase().includes(q));
    $('#list').innerHTML = list.length ? '' : '<li class="empty">Aucun son.</li>';
    list.forEach(it => {
      const li = document.createElement('li');
      li.dataset.id = it.id;
      li.innerHTML = `<button class="play" title="Écouter">▶</button><div><div class="t">${esc(it.title)}</div><div class="m">${esc(it.duration || '')}</div></div>`;
      li.addEventListener('click', () => focus(it));
      li.querySelector('.play').addEventListener('click', e => { e.stopPropagation(); focus(it, true); });
      $('#list').appendChild(li);
    });
    refreshActive();
  }

  async function load() {
    if (!API || /VOTRE-SOUS-DOMAINE/.test(API)) { status('Configurez API_URL dans config.js', true); return; }
    status('Chargement des sons…');
    try {
      const res = await fetch(API + '/list');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      items = (data.items || []).filter(it => Number.isFinite(it.lat) && Number.isFinite(it.lng));
      $('#count').textContent = items.length;
      items.forEach(it => {
        const m = L.marker([it.lat, it.lng], { icon: icon(false), title: it.title }).bindPopup(() => popupContent(it), { maxWidth: 280 }).addTo(map);
        markers.set(it.id, m);
      });
      if (items.length) map.fitBounds(L.latLngBounds(items.map(it => [it.lat, it.lng])), { padding: [50, 50], maxZoom: 16 });
      renderList();
      status('');
      const wanted = new URLSearchParams(location.search).get('son');
      const it = wanted && items.find(i => i.id === wanted);
      if (it) focus(it);
    } catch (err) {
      status('Impossible de charger les sons : ' + err.message, true);
    }
  }

  $('#toggle').addEventListener('click', () => { $('#panel').classList.toggle('hidden'); setTimeout(() => map.invalidateSize(), 300); });
  $('#filter').addEventListener('input', renderList);
  load();
})();
</script>
</body>
</html>
